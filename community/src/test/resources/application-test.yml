server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate.default_batch_fetch_size: 100
      hibernate.format_sql: true
    cache:
      type: redis
      data:
        redis:
          host: 127.0.0.1 # localhost
          port: 6379

  output:
    ansi:
      enabled: always
