# application-test.yml
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL # H2를 MySQL 문법 모드로 실행
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true # H2 콘솔 사용
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create # 테스트 실행 시 스키마를 새로 생성
    properties:
      hibernate:
        format_sql: true # SQL 쿼리 로그를 예쁘게 포맷팅
        default_batch_fetch_size: 100
    show-sql: true # 실행되는 SQL 쿼리를 로그로 출력
    defer-datasource-initialization: true # 데이터 초기화 지연