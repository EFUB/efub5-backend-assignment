spring:
  application:
    name: community
  profiles:
    active: test # 기본값은 dev, 필요시 ${SPRING_PROFILES_ACTIVE} 환경변수로 변경 가능

  datasource:
    url: jdbc:mysql://localhost:3306/blog?createDatabaseIfNotExist=true&characterEncoding=UTF-8&characterSetResults=UTF-8
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  logging:
    level:
      root: INFO
      org.springframework.core.env: DEBUG
